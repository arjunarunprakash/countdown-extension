<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Countdown logo concepts</title>
<style>
  body { margin: 0; min-height: 100vh; box-sizing: border-box; padding: 40px 48px 64px; font-family: "Inter", system-ui, sans-serif; color: #14161f;
    background: radial-gradient(50% 40% at 0% 0%, rgb(122 140 255 / 0.28), transparent 70%),
                radial-gradient(45% 35% at 100% 0%, rgb(206 150 255 / 0.22), transparent 70%),
                radial-gradient(60% 40% at 50% 100%, rgb(110 214 200 / 0.2), transparent 70%), #eef0f6; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { margin: 0 0 32px; color: #5b6070; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
  .card { background: rgb(255 255 255 / 0.62); border: 1px solid rgb(255 255 255 / 0.8); border-radius: 20px;
    padding: 20px; box-shadow: 0 0 0 0.5px rgb(20 22 31 / 0.08), 0 8px 24px rgb(20 22 31 / 0.06); }
  .head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .letter { font-weight: 600; color: #3451d1; }
  .name { font-weight: 600; }
  .hero { display: flex; align-items: end; gap: 14px; margin-bottom: 14px; }
  .hero svg { display: block; }
  .bars { display: grid; gap: 6px; }
  .bar { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; border-radius: 10px; font-size: 11px; }
  .bar.light { background: #fff; color: #5f6368; box-shadow: inset 0 0 0 1px #dadce0; }
  .bar.dark { background: #35363a; color: #bdc1c6; }
  .bar .slot { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; }
  .bar.light .slot.on { background: #e8eaed; }
  .bar.dark .slot.on { background: #4a4b4f; }
  .bar .ghost { width: 16px; height: 16px; border-radius: 4px; background: currentColor; opacity: 0.35; }
  .note { font-size: 13px; line-height: 1.5; color: #454a57; margin: 12px 0 0; }
</style>
</head>
<body>
<h1>Countdown logo concepts</h1>
<p class="sub">Each at 128px (store), 48px (extensions page), 32px and 16px (toolbar), on Chrome's light and dark toolbars. Colours come straight from the app's tokens.</p>
<div class="grid" id="grid"></div>
<script>
const A1 = "#3a54d6", A2 = "#6a46d4";
let uid = 0;
const pt = (cx, cy, r, deg) => { const a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
const arc = (cx, cy, r, a0, a1) => { const [x0, y0] = pt(cx, cy, r, a0), [x1, y1] = pt(cx, cy, r, a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; };
const wedge = (cx, cy, r, a0, a1) => `M${cx} ${cy}L${pt(cx, cy, r, a0).join(" ")}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${pt(cx, cy, r, a1).join(" ")}Z`;

// Shared defs: accent gradient, top glass sheen, frosted fill with app glows.
const defs = (id) => `<defs>
  <linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${A1}"/><stop offset="1" stop-color="${A2}"/></linearGradient>
  <linearGradient id="s${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.32"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="p${id}" cx="0.15" cy="0.1" r="0.8"><stop offset="0" stop-color="rgb(122,140,255)" stop-opacity="0.55"/><stop offset="1" stop-color="rgb(122,140,255)" stop-opacity="0"/></radialGradient>
  <radialGradient id="m${id}" cx="0.9" cy="0.95" r="0.75"><stop offset="0" stop-color="rgb(110,214,200)" stop-opacity="0.55"/><stop offset="1" stop-color="rgb(110,214,200)" stop-opacity="0"/></radialGradient>
  <radialGradient id="l${id}" cx="0.9" cy="0.05" r="0.7"><stop offset="0" stop-color="rgb(206,150,255)" stop-opacity="0.5"/><stop offset="1" stop-color="rgb(206,150,255)" stop-opacity="0"/></radialGradient>
</defs>`;
const SQ = `x="16" y="16" width="96" height="96" rx="26"`;
const gradientTile = (id) => `<rect ${SQ} fill="url(#g${id})"/><rect ${SQ} fill="url(#s${id})"/><rect x="16.5" y="16.5" width="95" height="95" rx="25.5" fill="none" stroke="#fff" stroke-opacity="0.22"/>`;
const frostTile = (id) => `<rect ${SQ} fill="#f6f7fc"/><rect ${SQ} fill="url(#p${id})"/><rect ${SQ} fill="url(#l${id})"/><rect ${SQ} fill="url(#m${id})"/><rect x="16.5" y="16.5" width="95" height="95" rx="25.5" fill="none" stroke="${A1}" stroke-opacity="0.16"/>`;

const concepts = [
  { name: "Ring", note: "The current mark, refined: the countdown ring with a glowing 'now' dot at its tip, on the accent gradient with a glass sheen. Strongest continuity with what you have.",
    draw: (id) => `${gradientTile(id)}
      <circle cx="64" cy="64" r="27" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="10"/>
      <path d="${arc(64, 64, 27, 0, 270)}" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
      <circle cx="${pt(64, 64, 27, 270)[0]}" cy="${pt(64, 64, 27, 270)[1]}" r="9" fill="#fff"/>
      <circle cx="${pt(64, 64, 27, 270)[0]}" cy="${pt(64, 64, 27, 270)[1]}" r="4" fill="${A2}"/>` },
  { name: "Sweep", note: "A timer dial: three quarters of the time left, swept in the accent gradient on a frosted tile with the app's periwinkle, lilac and mint glows. Reads as 'time remaining' even at 16px.",
    draw: (id) => `${frostTile(id)}
      <circle cx="64" cy="64" r="33" fill="#fff" stroke="${A1}" stroke-opacity="0.18" stroke-width="2"/>
      <path d="${wedge(64, 64, 29, 0, 270)}" fill="url(#g${id})"/>
      <circle cx="64" cy="64" r="7" fill="#fff"/>` },
  { name: "Stack", note: "The app's own UI: a countdown tile with two cards peeking behind it, like the repeating-event stacks. Most distinctive, but busier at 16px.",
    draw: (id) => `<rect x="32" y="22" width="64" height="20" rx="9" fill="#c4cbf4"/>
      <rect x="24" y="30" width="80" height="22" rx="11" fill="#9eaaf0"/>
      <rect x="16" y="40" width="96" height="66" rx="22" fill="url(#g${id})"/><rect x="16" y="40" width="96" height="66" rx="22" fill="url(#s${id})"/>
      <circle cx="46" cy="73" r="14" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="6"/>
      <path d="${arc(46, 73, 14, 0, 270)}" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <rect x="70" y="63" width="28" height="8" rx="4" fill="#fff"/>
      <rect x="70" y="77" width="18" height="7" rx="3.5" fill="#fff" fill-opacity="0.6"/>` },
  { name: "Numeral", note: "A bold countdown number, like the app's countdown boxes, with the ring as an accent. Friendly and obvious, though a number can read as a notification badge.",
    draw: (id) => `${gradientTile(id)}
      <path d="${arc(64, 64, 36, 210, 510)}" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="5" stroke-linecap="round"/>
      <path d="${arc(64, 64, 36, 210, 420)}" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <text x="64" y="81" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="48" letter-spacing="-2" fill="#fff">3</text>` },
  { name: "Hourglass", note: "A geometric hourglass in the accent gradient, the sand mostly run through. Universally understood, but the most conventional of the set.",
    draw: (id) => `${frostTile(id)}
      <path d="M42 34h44M42 94h44" stroke="url(#g${id})" stroke-width="7" stroke-linecap="round"/>
      <path d="M47 35c0 14 17 21 17 29s-17 15-17 29M81 35c0 14-17 21-17 29s17 15 17 29" fill="none" stroke="url(#g${id})" stroke-width="6" stroke-linecap="round"/>
      <path d="M53 41h22c-2 7-8 11-11 13c-3-2-9-6-11-13z" fill="url(#g${id})" fill-opacity="0.35"/>
      <path d="M64 75c6 3 11 8 12 14H52c1-6 6-11 12-14z" fill="url(#g${id})"/>` },
  { name: "Glass dial", note: "Liquid glass: a frosted lens floating over the accent gradient and a mint glow, with a slim ring inside. The most 'Apple glass', and closest to the panel's look.",
    draw: (id) => `<rect ${SQ} fill="url(#g${id})"/>
      <rect ${SQ} fill="url(#m${id})"/><rect ${SQ} fill="url(#m${id})"/>
      <rect ${SQ} fill="url(#l${id})"/>
      <rect ${SQ} fill="url(#s${id})"/>
      <circle cx="64" cy="64" r="33" fill="#fff" fill-opacity="0.2"/>
      <circle cx="64" cy="64" r="33" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/>
      <path d="${arc(64, 64, 31, 300, 420)}" fill="none" stroke="#fff" stroke-opacity="0.9" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="64" cy="64" r="20" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="6"/>
      <path d="${arc(64, 64, 20, 0, 270)}" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>` },
];

// Clip the glass dial's glows to the tile.
const svg = (c, size) => { const id = ++uid; const body = c.draw(id);
  const clip = `<clipPath id="c${id}"><rect ${SQ}/></clipPath>`;
  return `<svg width="${size}" height="${size}" viewBox="${size <= 32 ? "14 14 100 100" : "0 0 128 128"}" role="img" aria-label="${c.name} logo at ${size}px">${defs(id).replace("</defs>", clip + "</defs>")}<g clip-path="url(#c${id})">${body}</g></svg>`; };

const grid = document.getElementById("grid");
concepts.forEach((c, i) => {
  const bar = (mode) => `<div class="bar ${mode}"><span class="ghost"></span><span class="ghost"></span><span class="slot on">${svg(c, 16)}</span><span class="slot">${svg(c, 32)}</span><span>${mode}</span></div>`;
  grid.insertAdjacentHTML("beforeend", `<section class="card">
    <div class="head"><span class="letter">${String.fromCharCode(65 + i)}</span><span class="name">${c.name}</span></div>
    <div class="hero">${svg(c, 128)}${svg(c, 48)}</div>
    <div class="bars">${bar("light")}${bar("dark")}</div>
    <p class="note">${c.note}</p></section>`);
});
</script>
</body>
</html>
