<!doctype html>
<!-- Frame for Chrome Web Store screenshots (1280×800): the real side panel,
     running the dev build's sample data, beside a short caption.
     Rendered by scripts/screenshots.sh; needs `npm run preview` on :4173. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Countdown screenshot</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 64px;
    align-items: center;
    padding: 0 72px 0 96px;
    box-sizing: border-box;
    font-family: "Inter", system-ui, sans-serif;
    background:
      radial-gradient(60% 50% at 10% 10%, light-dark(rgb(122 140 255 / 0.35), rgb(79 99 230 / 0.3)), transparent 70%),
      radial-gradient(50% 50% at 90% 90%, light-dark(rgb(110 214 200 / 0.3), rgb(20 150 140 / 0.2)), transparent 70%),
      light-dark(#eef0f6, #0c0d12);
    color: light-dark(#14161f, #eceef2);
  }
  h1 { font-size: 44px; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 24px; font-weight: 700; }
  ul { margin: 0; padding: 0; list-style: none; font-size: 20px; line-height: 1.5; color: light-dark(#454a57, #b9bcc4); }
  li { padding-left: 28px; position: relative; margin-bottom: 10px; }
  li::before { content: ""; position: absolute; left: 0; top: 0.55em; width: 10px; height: 10px; border-radius: 50%; background: light-dark(#3451d1, #a3b2ff); }
  .panel {
    height: 720px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 24px 64px rgb(0 0 0 / 0.18), 0 0 0 1px light-dark(rgb(0 0 0 / 0.08), rgb(255 255 255 / 0.1));
  }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
  <div>
    <h1>Every deadline,<br>counting down beside your tabs</h1>
    <ul>
      <li>Live countdowns in days, hours, minutes or seconds</li>
      <li>Repeating items, grouped by colour-coded category</li>
      <li>Import from .ics files and calendar links</li>
      <li>Export to Google Calendar or any calendar app</li>
    </ul>
  </div>
  <div class="panel"><iframe src="http://localhost:4173/sidepanel/index.html?seed" title="Countdown side panel"></iframe></div>
</body>
</html>
